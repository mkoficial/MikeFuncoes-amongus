name: Compilar Mike Funções Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Compilar e juntar arquivos
        run: dotnet build MiraAPI.Example/MiraAPI.Example.csproj -c Release -o ./saida_mod

      - name: Enviar DLLs para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MikeFuncoesMod-Pronto
          path: ./saida_mod/*.dll
