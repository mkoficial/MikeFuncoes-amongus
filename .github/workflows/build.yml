name: Compilar Mike Funções Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restaurar dependências NuGet
        run: dotnet restore MiraAPI.Example/MiraAPI.Example.csproj

      - name: Compilar MiraAPI e Mike Funções Mod
        run: dotnet build MiraAPI.Example/MiraAPI.Example.csproj --configuration Release --no-restore

      - name: Enviar DLLs para Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MikeFuncoesMod-Android-PC
          path: |
            MiraAPI.Example/bin/Release/**/*.dll
